version: '3'
services:
  keycloak:
    container_name: keycloak-demo
    image: quay.io/keycloak/keycloak:26.6
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "9090:8080"
    networks:
      - keycloak-spring-net
    command:
      - "start-dev"
    volumes:
      - keycloak_data:/opt/keycloak/data
  mongodb:
    container_name: mongodb-demo
    image: mongo:7
    ports:
      - "27017:27017"
    networks:
      - keycloak-spring-net
    volumes:
      - mongo_data:/data/db

networks:
  keycloak-spring-net:
    driver: bridge
volumes:
  keycloak_data:
  mongo_data:
    